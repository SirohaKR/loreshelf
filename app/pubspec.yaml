# LoreShelf 앱 (Flutter) — 서버의 /api/... 를 그대로 불러 쓰는 보기 전용 앱 (1차: 편집 없음)
name: loreshelf_app
description: LoreShelf 캐릭터 아카이브 앱
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.11.0
resolution: workspace
dependencies:
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.0
  freezed_annotation: ^3.0.0
  hooks_riverpod: ^3.0.0
  http: ^1.2.0
  json_annotation: ^4.12.0
  loreshelf_shared:
    path: ../shared
  riverpod_annotation: ^4.0.3
  shared_preferences: ^2.3.0
dev_dependencies:
  build_runner: ^2.4.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: 4.0.0
  json_serializable: ^6.9.0
  riverpod_generator: ^4.0.4
flutter:
  uses-material-design: true
