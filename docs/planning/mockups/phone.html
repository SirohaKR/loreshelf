<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>모바일 미리보기</title>
<style>
  body { margin: 0; background: #e9ebef; font-family: 'Malgun Gothic', sans-serif; display: flex; gap: 48px;
         justify-content: center; align-items: flex-start; padding: 40px 40px 0; }
  .ph { text-align: center; }
  .frame { width: 390px; height: 844px; border-radius: 44px; border: 10px solid #1c2028; overflow: hidden; background: #fff; }
  iframe { width: 390px; height: 844px; border: 0; display: block; }
  p { margin: 14px 0 0; font-size: 15px; font-weight: 700; color: #3a3f4a; }
</style></head><body>
<script>
  const q = new URLSearchParams(location.search);
  (q.get('p') || 'home').split(',').forEach(s => {
    const [page, label, mode] = s.split(':');
    document.write(`<div class="ph"><div class="frame"><iframe src="${page}.html${mode ? '?' + mode : ''}"></iframe></div><p>${decodeURIComponent(label || page)}</p></div>`);
  });
</script>
</body></html>
