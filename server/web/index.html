<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LoreShelf · 내 캐릭터 서재</title>
<meta name="theme-color" content="#3f5bd8">
<script>
  // 화면이 그려지기 전에 테마부터 (깜빡임 방지)
  try {
    var t = localStorage.getItem('ls-theme') || 'system';
    if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
  } catch (e) {}
</script>
<link rel="stylesheet" href="/static/css/style.css?v={{v}}">
</head>
